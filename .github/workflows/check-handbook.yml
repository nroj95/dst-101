# Runs tools/check_handbook.py on every push and pull request, so a broken
# topic file is reported on GitHub instead of stopping the handbook in game.
name: check handbook

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install lupa==2.8
      - run: python tools/check_handbook.py
